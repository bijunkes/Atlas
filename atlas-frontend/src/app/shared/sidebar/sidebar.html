<!-- Botão hamburger (somente mobile) -->
<button type="button"
    class="fixed left-4 top-4 z-50 flex h-10 w-10 items-center justify-center rounded-xl border border-border bg-surface text-foreground shadow-lg transition-colors duration-200 hover:bg-surface-hover lg:hidden"
    (click)="toggleMobileMenu()" [attr.aria-expanded]="isMobileOpen()" aria-label="Abrir menu de navegação">
    <lucide-angular [img]="isMobileOpen() ? icons.X : icons.Menu" class="h-5 w-5" />
</button>

<!-- Overlay (somente mobile, fecha o menu ao clicar fora) -->
<div class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm transition-opacity duration-300 lg:hidden"
    [class.opacity-100]="isMobileOpen()" [class.pointer-events-auto]="isMobileOpen()"
    [class.opacity-0]="!isMobileOpen()" [class.pointer-events-none]="!isMobileOpen()" (click)="closeMobileMenu()"
    aria-hidden="true"></div>

<aside class="
    fixed inset-y-0 left-0
    -translate-x-full

    lg:translate-x-0

    z-40 flex flex-col
    border-r border-border
    bg-surface
    transition-all duration-300
    lg:m-3
    lg:h-[calc(100vh-1.5rem)]
    lg:rounded-2xl
    lg:border
    " [class.translate-x-0]="isMobileOpen()">

    <!-- Botão de colapso (somente desktop) -->
    <button type="button"
        class="hidden lg:flex absolute -right-3 top-8 h-6 w-6 items-center justify-center rounded-full border border-border bg-surface hover:bg-surface-hover"
        (click)="toggleCollapse()" [attr.aria-label]="isCollapsed() ? 'Expandir menu' : 'Recolher menu'">
        <lucide-angular [img]="isCollapsed() ? icons.ChevronRight : icons.ChevronLeft" class="h-4 w-4 text-white" />
    </button>

    <!-- Logo -->
    <div class="flex items-center border-b border-border px-5 py-5" [class.justify-center]="isCollapsed()"
        [class.gap-0]="isCollapsed()" [class.gap-3]="!isCollapsed()">

        <div
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl border border-primary/30 bg-primary/10 overflow-hidden">

            <img src="/images/logo-atlas.png" alt="Atlas" class="h-5 w-5 object-contain" />

        </div>

        @if (!isCollapsed()) {
        <div class="min-w-0 leading-tight">
            <p class="truncate text-[15px] font-extrabold tracking-tight text-foreground">Atlas</p>
            <p class="truncate text-[11px] text-muted">Gestão financeira</p>
        </div>
        }
    </div>

    <!-- Navegação -->
    <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-5">
        @for (item of navItems; track item.route) {
        <a [routerLink]="item.route" routerLinkActive #rla="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }" [title]="isCollapsed() ? item.label : null"
            class="group relative flex items-center rounded-xl px-3 py-2.5 text-sm font-medium transition-colors duration-200 hover:bg-white/5"
            [class.justify-center]="isCollapsed()" [class.justify-start]="!isCollapsed()" [class.gap-0]="isCollapsed()"
            [class.gap-3]="!isCollapsed()" class="group relative flex items-center rounded-xl px-3 py-2.5 text-sm font-medium
            text-foreground transition-colors duration-200 hover:bg-white/5">

            <span
                class="absolute left-0 top-1/2 h-5 w-[3px] -translate-y-1/2 rounded-r-full bg-primary transition-opacity duration-200"
                [class.opacity-100]="rla.isActive" [class.opacity-0]="!rla.isActive">
            </span>

            <lucide-angular [img]="item.icon" class="h-[18px] w-[18px] shrink-0 transition-colors duration-200"
                [class.text-primary]="rla.isActive" [class.text-zinc-500]="!rla.isActive" />

            @if (!isCollapsed()) {
            <span>{{ item.label }}</span>
            }
        </a>
        }
    </nav>

    <!-- Área do usuário -->
    <div class="flex items-center rounded-xl px-2 py-2">

        <a routerLink="/perfil" class="flex flex-1 items-center gap-3 hover:bg-white/5 rounded-xl p-1">

            <div
                class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-surface-hover text-xs font-bold text-foreground">
                {{ initials }}
            </div>

            @if (!isCollapsed()) {
            <div class="min-w-0 leading-tight">
                <p class="truncate text-[13px] font-semibold text-foreground">
                    {{ user?.nome }}
                </p>

                <p class="truncate text-[11px] text-muted">
                    {{ user?.email }}
                </p>
            </div>
            }

        </a>


        @if (!isCollapsed()) {
        <button type="button" (click)="onLogoutClick()"
            class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-muted transition-colors duration-200 hover:bg-surface-hover hover:text-white"
            aria-label="Sair da conta">

            <lucide-angular [img]="icons.LogOut" class="h-4 w-4" />

        </button>
        }

    </div>
</aside>
