@if (toastService.toast(); as toast) {

<div class="pointer-events-auto fixed inset-x-4 top-4 z-50 rounded-2xl border bg-surface p-4 shadow-2xl sm:inset-x-auto sm:right-6 sm:top-6 sm:w-96 sm:p-5"
    [class.border-red-500/30]="toast.type === 'error'" [class.border-green-500/30]="toast.type === 'success'"
    [class.border-yellow-500/30]="toast.type === 'warning'" [class.border-blue-500/30]="toast.type === 'info'">

    <div class="flex items-start gap-3">

        <div class="mt-0.5 shrink-0">
            @switch (toast.type) {
            @case ('error') { ❌ }
            @case ('success') { ✅ }
            @case ('warning') { ⚠️ }
            @default { ℹ️ }
            }
        </div>

        <div class="min-w-0 flex-1">
            <h3 class="text-sm font-semibold text-foreground sm:text-base">
                {{ toast.title }}
            </h3>

            <p class="mt-1 text-xs text-muted sm:text-sm">
                {{ toast.message }}
            </p>
        </div>

    </div>

</div>

}
