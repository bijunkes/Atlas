@if (toastService.toast(); as toast) {

<div
    class="pointer-events-auto fixed right-6 top-6 z-50 w-96 rounded-2xl border bg-surface p-5 shadow-2xl"

    [class.border-red-500/30]="toast.type==='error'"
    [class.border-green-500/30]="toast.type==='success'"
    [class.border-yellow-500/30]="toast.type==='warning'"
    [class.border-blue-500/30]="toast.type==='info'">

    <div class="flex items-start gap-3">

        <div class="mt-1">

            @switch (toast.type) {

                @case ('error') {
                    ❌
                }

                @case ('success') {
                    ✅
                }

                @case ('warning') {
                    ⚠️
                }

                @default {
                    ℹ️
                }

            }

        </div>

        <div class="flex-1">

            <h3 class="font-semibold text-foreground">

                {{ toast.title }}

            </h3>

            <p class="mt-1 text-sm text-muted">

                {{ toast.message }}

            </p>

        </div>

    </div>

</div>

}
