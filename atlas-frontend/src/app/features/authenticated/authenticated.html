<div class="flex min-h-screen bg-background">

    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden"></div>
    <div class="pointer-events-none absolute inset-0 
                bg-[linear-gradient(to_right,rgba(255,255,255,0.025)_1px,transparent_1px),linear-gradient(to_bottom,rgba(255,255,255,0.025)_1px,transparent_1px)]
                bg-[length:64px_64px]
                [mask-image:radial-gradient(ellipse_70%_60%_at_30%_40%,black_30%,transparent_75%)]">
    </div>

    <div class="pointer-events-none absolute -left-36 -top-36 
                h-[520px] w-[520px] rounded-full
                bg-[radial-gradient(circle,rgba(34,197,94,0.16)_0%,rgba(34,197,94,0)_70%)]">
    </div>

    <div class="pointer-events-none absolute -left-[260px] -top-[180px]
                h-[640px] w-[640px] rounded-full
                border border-white/5">
    </div>

    <div class="pointer-events-none absolute -left-[150px] -top-[70px]
                h-[420px] w-[420px] rounded-full
                border border-white/[0.04]">
    </div>

    <app-sidebar [user]="usuario()" (logout)="onLogout()" />

    <main class="flex-1 overflow-y-auto p-6 lg:ml-60">
        <router-outlet />
    </main>

</div>
