<section id="sobre" class="bg-zinc-950 py-28">
    <div class="mx-auto max-w-7xl px-6 lg:px-8">

        <div
            class="relative overflow-hidden rounded-[2rem] border border-zinc-800 bg-zinc-900 px-8 py-20 text-center shadow-2xl">

            <!-- Glow -->
            <div
                class="absolute left-1/2 top-0 h-[38rem] w-[38rem] -translate-x-1/2 -translate-y-1/2 rounded-full bg-green-500/10 blur-3xl">
            </div>

            <!-- Conteúdo -->
            <div class="relative z-10 mx-auto max-w-3xl">

                <h2 class="font-manrope text-4xl font-extrabold leading-tight tracking-tight text-white md:text-5xl">
                    Comece a transformar sua
                    <br>
                    vida financeira hoje.
                </h2>

                <p class="mx-auto mt-6 max-w-xl text-lg leading-8 text-zinc-400">
                    O Atlas ajuda você a tomar decisões melhores sobre seu dinheiro.
                </p>

                <button
                    (click)="createAccount()"
                    class="mt-10 inline-flex items-center gap-2 rounded-xl bg-green-500 px-7 py-4 font-semibold text-zinc-950 transition hover:bg-green-600">

                    Criar minha conta

                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                        stroke-linecap="round" stroke-linejoin="round">

                        <path d="M5 12h14"></path>
                        <path d="m13 6 6 6-6 6"></path>

                    </svg>

                </button>

            </div>

        </div>

    </div>
</section>
